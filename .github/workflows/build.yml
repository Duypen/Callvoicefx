name: Build CallVoiceFX .deb

on:
  workflow_dispatch:   # bấm nút "Run workflow" thủ công trên tab Actions
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot rsync curl git perl wget sudo \
            build-essential clang make lld \
            xz-utils bison flex python3 libtinfo6 libssl-dev

      - name: Install Theos (official installer, sets up Linux toolchain)
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install missing SDK (theos-headers / iOS SDK stub)
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks
          mkdir -p $HOME/theos/sdks
          cp -r $HOME/sdks/iPhoneOS16.5.sdk $HOME/theos/sdks/ 2>/dev/null || \
          cp -r $HOME/sdks/*.sdk $HOME/theos/sdks/

      - name: Build package
        run: |
          export THEOS=$HOME/theos
          cd "mytweak 2"
          make clean package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallVoiceFX-deb
          path: "mytweak 2/packages/*.deb"
